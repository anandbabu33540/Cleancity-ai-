<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotspots - CleanCity-AI</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f7faf8; }
        header { background: #fff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: bold; color: #0a9560; display: flex; align-items: center; gap:10px; }
        .nav-links { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
        .nav-links a { text-decoration: none; color: #555; }
        main { display: flex; gap: 20px; padding: 20px 5%; max-width: 1200px; margin: auto; flex-wrap: wrap; }
        #hotspotMap { flex: 2; min-width: 300px; height: 500px; border-radius: 12px; z-index: 1; }
        .sidebar { flex: 1; min-width: 300px; background: white; padding: 20px; border-radius: 12px; }
        .hotspot-card { padding: 15px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 15px; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; color: white; }
        .badge-high { background: #e78b33; }
        .badge-medium { background: #d7b83a; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><img src="logo.svg" alt="Logo" width="30" onerror="this.src='https://via.placeholder.com/30/0a9560/fff?text=CC';"> CleanCity-AI</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="hotspots.html">Hotspots</a></li>
        </ul>
    </header>

    <main>
        <div id="hotspotMap"></div>
        <div class="sidebar">
            <h2>Critical Hotspots</h2>
            <div id="hotspotCards"></div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="app.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => { if(typeof initHotspots === 'function') initHotspots(); });</script>
</body>
</html>

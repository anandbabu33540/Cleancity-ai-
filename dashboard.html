<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CleanCity-AI</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f7faf8; color: #333; }
        header { background: #fff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: bold; color: #0a9560; }
        .nav-links { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
        .nav-links a { text-decoration: none; color: #555; }
        main { padding: 40px 5%; max-width: 1200px; margin: auto; display: flex; gap: 20px; flex-wrap: wrap; }
        .panel { background: white; padding: 20px; border-radius: 12px; flex: 1; min-width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn { padding: 8px 15px; background: #eee; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        #toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 10px 20px; border-radius: 8px; display: none; }
        #toast.show { display: block; }
        .queue-item, .activity { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;}
    </style>
</head>
<body>
    <header>
        <div class="logo"><img src="logo.svg" alt="Logo" width="30" onerror="this.src='https://via.placeholder.com/30/0a9560/fff?text=CC';"> CleanCity-AI</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html">Admin Dashboard</a></li>
        </ul>
    </header>

    <main>
        <div class="panel">
            <h2>Workload Overview</h2>
            <div style="height: 250px;"><canvas id="workloadChart"></canvas></div>
            <div style="margin-top: 20px;">
                <button id="refreshDemo" class="btn">Refresh Data</button>
                <button id="simulateAlert" class="btn">Simulate Alert</button>
                <button id="themeBtn" class="btn">Toggle Theme</button>
            </div>
        </div>
        
        <div class="panel">
            <h2>Live Action Queue</h2>
            <div id="queue"></div>
        </div>

        <div class="panel">
            <h2>Recent Activity</h2>
            <div id="activityFeed"></div>
        </div>
    </main>

    <div id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="app.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => { if(typeof initDashboard === 'function') initDashboard(); });</script>
</body>
</html>
